<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- NO recomendado. Limpia cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Gran Rifa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100 py-5">

        <header class="text-center mb-5 w-100">
            <h1 class="display-1 fw-bold main-title">GRAN RIFA</h1>
            <h2 class="h4 mt-4 fw-semibold subtitle">PREMIO: <span class="prize-amount">$ 400.000 PESOS</span></h2>
        </header>

        <main class="w-100 max-w-custom">
            <!-- Grid Container -->
            <div id="raffle-grid" class="raffle-grid mb-5">
                <!-- Numbers will be injected here by Javascript -->
            </div>

            <!-- Leyenda de colores -->
            <div class="d-flex justify-content-center gap-4 mb-4 legend-container flex-wrap">
                <div class="d-flex align-items-center gap-2">
                    <span class="legend-box available"></span> Disponible
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="legend-box pending"></span> Pendiente
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="legend-box paid"></span> Pagada
                </div>
            </div>
        </main>

        <footer class="text-center mt-auto w-100">
            <p class="fs-5 fw-medium footer-text">$10.000 - Lotería de Boyacá 30 de Mayo</p>
            <p class="fs-5 fw-medium footer-text">Puedes realizar los pagos a Nequi o llave bre-b al número
                <strong>3238141241</strong>
            </p>
        </footer>
    </div>

    <!-- Bootstrap Bundle with Popper (required for Tooltips) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="main.js"></script>
</body>

</html>
